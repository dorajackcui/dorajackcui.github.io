name: OTA Mail Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/ota-mail-sync.yml'
      - 'kobayashi-pms-mail-worker/**'

permissions:
  contents: read

concurrency:
  group: ota-mail-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 2
      - uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          node-version: '24'
      - name: Install worker dependencies
        run: npm install --prefix kobayashi-pms-mail-worker --no-audit --no-fund
        continue-on-error: true
        timeout-minutes: 2
      - name: Sync OTA emails from iCloud
        run: npm run --prefix kobayashi-pms-mail-worker sync
        continue-on-error: true
        timeout-minutes: 4
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ICLOUD_1_APP_PASSWORD: ${{ secrets.ICLOUD_1_APP_PASSWORD }}
          ICLOUD_2_APP_PASSWORD: ${{ secrets.ICLOUD_2_APP_PASSWORD }}
          ICLOUD_3_APP_PASSWORD: ${{ secrets.ICLOUD_3_APP_PASSWORD }}
          ICLOUD_4_APP_PASSWORD: ${{ secrets.ICLOUD_4_APP_PASSWORD }}
          ICLOUD_5_APP_PASSWORD: ${{ secrets.ICLOUD_5_APP_PASSWORD }}
      - name: Remove sensitive authentication emails
        run: node kobayashi-pms-mail-worker/src/cleanup-sensitive.mjs
        continue-on-error: true
        timeout-minutes: 1
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Consolidate emails and match PMS reservations
        run: node kobayashi-pms-mail-worker/src/post-match.mjs
        continue-on-error: true
        timeout-minutes: 2
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: OTA sync heartbeat
        if: always()
        run: echo "OTA mail sync cycle finished. Detailed connection state is tracked inside Kobayashi PMS."
